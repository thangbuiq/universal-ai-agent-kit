[project]
name = "universal-ai-agent-kit"
version = "0.1.0"
description = "One CLI to sync skills, commands, MCP servers and instructions into Claude Code, OpenCode, Codex and GitHub Copilot CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "loguru>=0.7"]

[project.scripts]
uak = "uak.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uak"]

# Bundle the kit so a regular (non-editable) install still finds it.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "uak/kit/skills"
"commands" = "uak/kit/commands"
"mcps" = "uak/kit/mcps"
"AGENTS.md" = "uak/kit/AGENTS.md"

[dependency-groups]
dev = ["prek>=0.2", "ruff>=0.9"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
